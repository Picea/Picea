name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in the Picea kernel"
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Minimal code example or steps to reproduce the behavior."
      placeholder: |
        ```csharp
        // Minimal reproduction
        var runtime = await AutomatonRuntime<MyAutomaton, ...>.Start(...);
        await runtime.Dispatch(...);
        // Expected: ...
        // Actual: ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: ".NET version, OS, Picea package version"
      placeholder: |
        - .NET: 10.0
        - OS: macOS 15 / Ubuntu 24.04 / Windows 11
        - Picea: 1.0.0-rc.1
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Stack traces, logs, related issues."
    validations:
      required: false

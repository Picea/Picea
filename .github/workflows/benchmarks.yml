# =============================================================================
# Continuous Benchmarking — BenchmarkDotNet + GitHub Pages
# =============================================================================
# Runs benchmarks on every push to main. Results are tracked on GitHub Pages
# with interactive charts. Performance regressions exceeding the threshold
# fail the build and leave a comment on the offending commit.
#
# Dashboard: https://picea.github.io/picea/dev/bench/
# =============================================================================

name: Benchmarks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Picea/**'
      - 'Picea.Benchmarks/**'
      - 'Picea.Tests/**'
      - '.github/workflows/benchmarks.yml'
      - 'Directory.Build.props'
      - 'global.json'
      - 'Picea.sln'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.103'

      - name: Run BenchmarkDotNet
        run: >
          dotnet run
          --project Picea.Benchmarks/Picea.Benchmarks.csproj
          -c Release
          --
          --filter '*'
          --exporters json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Picea Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: BenchmarkDotNet.Artifacts/results/Picea.Benchmarks.PiceaBenchmarks-report-full-compressed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          # ── Regression detection ────────────────────────────
          # Alert at 105%, fail at 105% (any benchmark >5% slower → red build)
          # Math: regression_ratio = current / baseline; fail when regression_ratio > 1.05
          alert-threshold: '105%'
            # Only fail on pushes to main. PR runs are informational — shared CI runners
            # have significant machine variance, making sub-5% thresholds unreliable for PRs.
            # PRs still get a benchmark summary and alert comment, but will not block merge.
            fail-on-alert: ${{ github.event_name == 'push' }}
            comment-on-alert: true
          alert-comment-cc-users: '@MCGPPeters'
          # ── Job summary in PR / commit view ─────────────────
          summary-always: true
